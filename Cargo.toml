[package]
name = "bups"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "bups - the print server for USB-based label printers"
repository = "https://github.com/metaneutrons/bups"
homepage = "https://github.com/metaneutrons/bups"
keywords = ["label", "print", "server", "usb"]
authors = ["Fabian Schmieder"]
rust-version = "1.74"

[build-dependencies]
vergen-gitcl = { version = "1", features = ["build", "cargo", "rustc"] }

[dependencies]
nusb = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.17"
local-ip-address = "0.6"
rasn = "0.28"
rasn-snmp = "0.28"
rasn-smi = "0.28"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
syslog-tracing = "0.3"
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
