[package]
name = "bups"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "bups - the print server for USB-based label printers"
repository = "https://github.com/metaneutrons/bups"
homepage = "https://github.com/metaneutrons/bups"
keywords = ["label", "print", "server", "usb"]
categories = ["hardware-support", "network-programming"]
authors = ["Fabian Schmieder"]
rust-version = "1.95"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[build-dependencies]
vergen-gitcl = { version = "9", features = ["build", "cargo", "rustc"] }

[dependencies]
nusb = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.19"
local-ip-address = "0.6"
rasn = "0.28"
rasn-snmp = "0.28"
rasn-smi = "0.28"
thiserror = "2"
bitflags = "2"

[target.'cfg(unix)'.dependencies]
syslog-tracing = "0.3"
libc = "0.2"

[profile.release]
lto = true
strip = true
