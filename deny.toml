[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "rasn still requires chrono for ASN.1 date/time values; all chrono versions are affected and no safe upgrade exists. Revisit when upstream removes this dependency. Reviewed 2026-11-26." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
