[advisories]
version = 2
# Keine Ignores. RUSTSEC-2026-0009 war nur wirksam, weil rust-version = "1.85"
# den MSRV-bewussten Resolver (Edition 2024 / Resolver 3) daran hinderte,
# time >= 0.3.47 zu waehlen. Mit MSRV 1.95 loest der Resolver auf 0.3.55 auf.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
