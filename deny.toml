[advisories]
version = 2
ignore = [
    # time 0.3.47 requires Rust 1.88+; only used at build-time by vergen-gitcl
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
